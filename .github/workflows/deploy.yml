---
name: Entur/Helm/Deploy

on:
  workflow_call:
    inputs:
      image:
        description: "The image to deploy, on the form app:tag. Use `na` value to skip replacing the image version in the helm config."
        required: true
        type: string
      cloud_provider:
        description: "Which cloud service provider to use - Google Cloud: 'gcp' or Azure: 'az'"
        type: string
        default: "gcp"
      environment:
        type: string
        description: "GitHub environment to use Google Cloud: (dev, tst, prd) or Azure: (az-dev, az-test, az-prod)"
        required: true
      chart:
        description: "The chart, defaults to `helm/$repository_name`"
        type: string
        default: "repo_name"
      values:
        description: "The values file in `./helm/$app/env/`, default `values-kub-ent-$environment.yaml`"
        type: string
        default: "values"
      release_name:
        description: "The release name, defaults to repository name"
        type: string
        default: "repo_name"
      namespace:
        description: "The namespace to use, defaults to repository name"
        type: string
        default: "repo_name"
      gcp_project_id:
        type: string
        description: "Do not use this input"
      gcp_cluster_name:
        type: string
        description: "Do not use this input"
      gcp_cluster_location:
        type: string
        description: "Defaults to europe-west1"
        default: "europe-west1"
      timeout_minutes:
        description: "Job timeout in minutes. Helm deploy timeout is half of this value to enable rollback. Default is 30 minutes."
        type: number
        default: 30
      image_set_path:
        description: "Comma-separated Helm values path(s) for the container image. Override when using aliased common chart dependencies (multi-app deploy), e.g. 'multi-1.container.image,multi-2.container.image' - or when using 3rd party charts. When container_name is set, the default value is skipped; provide a non-default path here to run both mechanisms."
        type: string
        default: "common.container.image"
      container_name:
        description: "Replace the image of a named container in the common.containers array. Resolves the array index automatically using the container name in values.yaml. Can be combined with an explicit image_set_path for multi-app deploys."
        type: string
        default: ""
        required: false
      git_ref:
        description: "Git reference to check out before deployment. This can be used as an override if necessary"
        type: string
        required: false
      slack_channel_id:
        description: "Optional Slack channel ID (not name) to post deploy status notifications to. Requires 'secrets: inherit' on the caller workflow and run a '/invite @GitHub Actions' in the Slack channel."
        type: string
        required: false
    outputs:
      HELM_DEPLOY_STATUS:
        description: "Helm Deploy Status 0: Success, 1: Failed, 2: Rollback, 3: Rollback Failed"
        value: ${{ jobs.helm-deploy.outputs.HELM_DEPLOY_STATUS }}
jobs:
  # Posts the "Approval Needed" Slack message. This must be a separate job:
  # the environment approval gate on helm-deploy blocks its steps from
  # starting, so a pre-approval notification can never run inside it.
  slack-pending:
    if: inputs.slack_channel_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      message_ts: ${{ steps.slack-post.outputs.message_ts }}
    steps:
      - id: check-approval
        name: check if environment has approval gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if ! RULES=$(gh api "repos/${REPOSITORY}/environments/${ENVIRONMENT}" --jq '[.protection_rules[]?.type] | join(",")' 2>&1); then
            echo "::warning::Could not fetch environment protection rules: ${RULES}, requires read access to the repository."
            echo "has_approval_gate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RULES" == *"required_reviewers"* ]]; then
            echo "has_approval_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_approval_gate=false" >> "$GITHUB_OUTPUT"
          fi
      - id: build-message
        if: steps.check-approval.outputs.has_approval_gate == 'true'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE=":lock: Approval Needed | ${REPOSITORY} → ${ENVIRONMENT}"
          echo "message=${MESSAGE}" >> "$GITHUB_OUTPUT"

          BLOCKS=$(jq -nc \
            --arg repo "$REPOSITORY" \
            --arg env "$ENVIRONMENT" \
            --arg image "$IMAGE" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '[
              {"type":"header","text":{"type":"plain_text","text":":lock: Approval Needed","emoji":true}},
              {"type":"section","fields":[
                {"type":"mrkdwn","text":"*Repository:* \($repo)"},
                {"type":"mrkdwn","text":"*Environment:* \($env)"},
                {"type":"mrkdwn","text":"*Triggered by:* \($actor)"}
              ]},
              {"type":"context","elements":[{"type":"mrkdwn","text":"Image: `\($image)`"}]},
              {"type":"section","text":{"type":"mrkdwn","text":"<\($url)|Approve Deployment>"}}
            ]'
          )
          echo "blocks<<GHA_SLACK_BLOCKS_EOF" >> "$GITHUB_OUTPUT"
          echo "$BLOCKS" >> "$GITHUB_OUTPUT"
          echo "GHA_SLACK_BLOCKS_EOF" >> "$GITHUB_OUTPUT"
      - id: slack-post
        name: Post approval message to Slack
        if: steps.check-approval.outputs.has_approval_gate == 'true'
        timeout-minutes: 1
        uses: entur/gha-slack/.github/actions/post@v3
        with:
          channel_id: ${{ inputs.slack_channel_id }}
          message: ${{ steps.build-message.outputs.message }}
          blocks: ${{ steps.build-message.outputs.blocks }}
          token: ${{ secrets.SLACK_BOT_TOKEN }}
      # The approval post lives in this separate job, so its silent failures
      # (bad channel / missing invite / no secrets: inherit) aren't visible to
      # the warning in helm-deploy. post@v3 returns empty message_ts on an API
      # error, so treat a non-success outcome OR an empty ts as not-delivered.
      - name: Warn if approval message was not delivered
        if: >-
          always() && steps.check-approval.outputs.has_approval_gate == 'true' &&
          (steps.slack-post.outcome != 'success' || steps.slack-post.outputs.message_ts == '')
        shell: bash
        run: |
          echo "::warning::Slack approval notification was not delivered — check slack_channel_id, that the workflow is called with 'secrets: inherit', and that the Slack bot is invited to the channel."
  helm-deploy:
    needs: [slack-pending]
    # !cancelled() (not the default success()) is required: slack-pending is
    # skipped when Slack is disabled, and a skipped needed job would otherwise
    # skip this job too — breaking every deploy without slack_channel_id.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    name: Helm deploy
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      GHA_HELM_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      GHA_HELM_DEPLOY_IMAGE: ${{ inputs.image }}
      GHA_HELM_DEPLOY_CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      GHA_HELM_DEPLOY_RELEASE_NAME: ${{ inputs.release_name }}
      GHA_HELM_DEPLOY_CHART: ${{ inputs.chart }}
      GHA_HELM_DEPLOY_VALUES: ${{ inputs.values }}
      GHA_HELM_DEPLOY_NAMESPACE: ${{ inputs.namespace }}
      GHA_HELM_DEPLOY_ENV: ${{inputs.environment }}
      GHA_HELM_DEPLOY_REGISTRY: eu.gcr.io/entur-system-1287
      GHA_HELM_DEPLOY_GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
      GHA_HELM_DEPLOY_GCP_CLUSTER_NAME: ${{ inputs.gcp_cluster_name }}
      GHA_HELM_DEPLOY_GCP_CLUSTER_LOCATION: ${{ inputs.gcp_cluster_location }}
      GHA_HELM_DEPLOY_IMAGE_SET_PATH: ${{ inputs.image_set_path }}
      GHA_HELM_DEPLOY_CONTAINER_NAME: ${{ inputs.container_name }}
      GHA_GIT_REF: ${{ inputs.git_ref }}
      # ignore "context access might be invalid" warning
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLUSTER_NAME: ${{ vars.AZURE_CLUSTER_NAME  }}
      AZURE_CLUSTER_RESOURCE_GROUP: ${{ vars.AZURE_CLUSTER_RESOURCE_GROUP }}
    outputs:
      HELM_DEPLOY_STATUS: ${{ steps.helm-deploy.outputs.HELM_DEPLOY_STATUS }}
      DEPLOY_START_TIME: ${{ steps.record-start.outputs.time }}
      DEPLOY_END_TIME: ${{ steps.record-end.outputs.time }}
    steps:
      # This job only starts once the environment approval gate (if any) has
      # been passed, so reaching this step means the deployment was approved.
      - id: slack-approved-react
        name: React to Slack approval message
        if: needs.slack-pending.outputs.message_ts != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: entur/gha-slack/.github/actions/react@v3
        with:
          channel_id: ${{ inputs.slack_channel_id }}
          message_ts: ${{ needs.slack-pending.outputs.message_ts }}
          emoji: white_check_mark
          token: ${{ secrets.SLACK_BOT_TOKEN }}
      - id: verify-cloud-provider
        if: env.GHA_HELM_DEPLOY_CLOUD_PROVIDER != 'gcp' && env.GHA_HELM_DEPLOY_CLOUD_PROVIDER != 'az'
        shell: bash
        run: |
          echo "Invalid cloud provider input: ${GHA_HELM_DEPLOY_CLOUD_PROVIDER}"
          echo "Valid options are: 'gcp' or 'az'"
          exit 1
      - id: verify-image
        if: env.GHA_HELM_DEPLOY_IMAGE == '' || env.GHA_HELM_DEPLOY_IMAGE == ':'
        shell: bash
        run: |
          echo "Invalid image input: ${GHA_HELM_DEPLOY_IMAGE}"
          exit 1
      - id: set-release-name
        if: env.GHA_HELM_DEPLOY_RELEASE_NAME == 'repo_name'
        shell: bash
        run: |
          echo "GHA_HELM_DEPLOY_RELEASE_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - id: set-chart-name
        if: env.GHA_HELM_DEPLOY_CHART == 'repo_name'
        shell: bash
        run: |
          echo "GHA_HELM_DEPLOY_CHART=helm/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - id: set-namespace
        if: env.GHA_HELM_DEPLOY_NAMESPACE == 'repo_name'
        shell: bash
        run: |
          echo "GHA_HELM_DEPLOY_NAMESPACE=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - id: set-values-file
        if: env.GHA_HELM_DEPLOY_VALUES == 'values'
        shell: bash
        run: |
          echo "GHA_HELM_DEPLOY_VALUES=values-kub-ent-${GHA_HELM_DEPLOY_ENV}.yaml" >> $GITHUB_ENV
      - id: set-registry-azure
        if: env.GHA_HELM_DEPLOY_CLOUD_PROVIDER == 'az'
        shell: bash
        run: |
          echo "GHA_HELM_DEPLOY_REGISTRY=acrentur001.azurecr.io" >> $GITHUB_ENV
      - id: verify-clustername-az
        name: Verify Cluster Name Azure
        shell: bash
        if: inputs.cloud_provider == 'az' && !env.AZURE_CLUSTER_NAME
        run: |
          echo "GitHub repository environment variable AZURE_CLUSTER_NAME is not set. Setup using tf-azure-apps. Exiting."
          exit 1
      - id: checkout-default-ref
        uses: actions/checkout@v6
        if: env.GHA_GIT_REF == ''
      - id: checkout-specific-ref
        uses: actions/checkout@v6
        if: env.GHA_GIT_REF != ''
        with:
          ref: ${{ env.GHA_GIT_REF }}
      - id: install
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "v3.20.1"
      - uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ env.GHA_HELM_DEPLOY_ENVIRONMENT }}
          cloud_provider: ${{ env.GHA_HELM_DEPLOY_CLOUD_PROVIDER }}
          gcp_workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ env.GHA_HELM_DEPLOY_ENVIRONMENT }}
          cloud_provider: ${{ env.GHA_HELM_DEPLOY_CLOUD_PROVIDER }}
          gcp_project_id: ${{ env.GHA_HELM_DEPLOY_GCP_PROJECT_ID }}
          gcp_cluster_name: ${{ env.GHA_HELM_DEPLOY_GCP_CLUSTER_NAME }}
          gcp_cluster_location: ${{ env.GHA_HELM_DEPLOY_GCP_CLUSTER_LOCATION }}
          azure_cluster_resource_group: ${{ env.AZURE_CLUSTER_RESOURCE_GROUP }}
          azure_cluster_name: ${{ env.AZURE_CLUSTER_NAME }}
          azure_token: ${{ secrets.GITHUB_TOKEN }}
      - id: record-start
        name: Record deployment start time
        shell: bash
        run: echo "time=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - id: helm-deploy
        name: Helm deploy ./${{ env.GHA_HELM_DEPLOY_CHART }}
        uses: entur/gha-helm/.github/actions/helm-deploy@v1
        with:
          timeout_minutes: ${{ inputs.timeout_minutes }}
          image: ${{ env.GHA_HELM_DEPLOY_IMAGE }}
          release_name: ${{ env.GHA_HELM_DEPLOY_RELEASE_NAME }}
          chart: ${{ env.GHA_HELM_DEPLOY_CHART }}
          values: ${{ env.GHA_HELM_DEPLOY_VALUES }}
          namespace: ${{ env.GHA_HELM_DEPLOY_NAMESPACE }}
          image_set_path: ${{ env.GHA_HELM_DEPLOY_IMAGE_SET_PATH }}
          container_name: ${{ env.GHA_HELM_DEPLOY_CONTAINER_NAME }}
          registry: ${{ env.GHA_HELM_DEPLOY_REGISTRY }}
      - id: record-end
        name: Record deployment end time
        if: always()
        shell: bash
        run: echo "time=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - id: build-slack-message
        name: Build Slack deploy status message
        if: always() && inputs.slack_channel_id != ''
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_STATUS: ${{ steps.helm-deploy.outputs.HELM_DEPLOY_STATUS }}
          REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${DEPLOY_STATUS}" in
            0)
              EMOJI=":white_check_mark:"
              TITLE="Helm Deploy Successful"
              STATUS_TEXT="Deploy Successful"
              ;;
            1)
              EMOJI=":x:"
              TITLE="Helm Deploy Failed"
              STATUS_TEXT="Deploy Failed (no previous release to roll back to)"
              ;;
            2)
              EMOJI=":warning:"
              TITLE="Helm Deploy Failed — Rolled Back"
              STATUS_TEXT="Deploy Failed, Rollback Succeeded"
              ;;
            3)
              EMOJI=":rotating_light:"
              TITLE="CRITICAL — Helm Deploy & Rollback Failed"
              STATUS_TEXT="Deploy Failed, Rollback Also Failed"
              ;;
            *)
              EMOJI=":question:"
              TITLE="Helm Deploy Status Unknown"
              STATUS_TEXT="Unknown (status: ${DEPLOY_STATUS:-empty})"
              ;;
          esac

          MESSAGE="${EMOJI} ${TITLE} | ${REPOSITORY} → ${ENVIRONMENT}"
          echo "message=${MESSAGE}" >> "$GITHUB_OUTPUT"

          BLOCKS=$(jq -nc \
            --arg emoji "$EMOJI" \
            --arg title "$TITLE" \
            --arg repo "$REPOSITORY" \
            --arg env "$ENVIRONMENT" \
            --arg image "$IMAGE" \
            --arg status "$STATUS_TEXT" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '[
              {"type":"header","text":{"type":"plain_text","text":"\($emoji) \($title)","emoji":true}},
              {"type":"section","fields":[
                {"type":"mrkdwn","text":"*Repository:* \($repo)"},
                {"type":"mrkdwn","text":"*Environment:* \($env)"},
                {"type":"mrkdwn","text":"*Status:* \($status)"},
                {"type":"mrkdwn","text":"*Triggered by:* \($actor)"}
              ]},
              {"type":"context","elements":[{"type":"mrkdwn","text":"Image: `\($image)`"}]},
              {"type":"section","text":{"type":"mrkdwn","text":"<\($url)|View Workflow Run>"}}
            ]'
          )
          echo "blocks<<GHA_SLACK_BLOCKS_EOF" >> "$GITHUB_OUTPUT"
          echo "$BLOCKS" >> "$GITHUB_OUTPUT"
          echo "GHA_SLACK_BLOCKS_EOF" >> "$GITHUB_OUTPUT"
      - id: slack-notify
        name: Post deploy status to Slack
        if: always() && steps.build-slack-message.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: entur/gha-slack/.github/actions/post@v3
        with:
          channel_id: ${{ inputs.slack_channel_id }}
          message: ${{ steps.build-slack-message.outputs.message }}
          blocks: ${{ steps.build-slack-message.outputs.blocks }}
          token: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Warn if Slack notification was not delivered
        if: >-
          always() && inputs.slack_channel_id != '' &&
          (steps.slack-approved-react.outcome == 'failure' ||
           steps.build-slack-message.outcome == 'failure' ||
           steps.slack-notify.outcome == 'failure' ||
           (steps.slack-notify.outcome == 'success' && steps.slack-notify.outputs.message_ts == ''))
        shell: bash
        run: |
          echo "::warning::Slack notification failed or was not delivered — check slack_channel_id, that the workflow is called with 'secrets: inherit', and that the Slack bot is invited to the channel."
      - uses: entur/gha-meta/.github/actions/posthog@v1
        id: send-analytics
        name: Send analytics to PostHog
        if: always()
        with:
          api_key:         ${{ vars.POSTHOG_API_TOKEN_PLATTFORM }}
          gha_repository:  entur/gha-helm # This must be hardcoded to the repository where the workflow is defined.
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_name:   helm-deploy
  notify-deployment:
    # Notify external systems (GitDailies, Grafana Cloud) of a successful deploy.
    # Driven by org-level config; skipped where the webhook vars are not set.
    if: >-
      always() &&
      needs.helm-deploy.outputs.HELM_DEPLOY_STATUS == '0' &&
      (vars.GITDAILIES_WEBHOOK_URL != '' || vars.GRAFANA_CLOUD_URL != '')
    needs: [helm-deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: prepare
        name: Map environment and annotation text
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Map gha-helm environments (dev, tst, prd / az-dev, az-test, az-prod)
          # to the notify-deployment environments (prd, tst, dev, sbx).
          env_clean="${ENVIRONMENT#az-}"
          case "$env_clean" in
            prd|prod) mapped="prd" ;;
            tst|test) mapped="tst" ;;
            dev)      mapped="dev" ;;
            sbx)      mapped="sbx" ;;
            *)        mapped="$env_clean" ;;
          esac
          echo "environment=${mapped}" >> "$GITHUB_OUTPUT"

          # Use the deployed image (name:tag) as the annotation text, unless image
          # replacement was skipped (image: na), in which case identify by commit.
          if [[ "$IMAGE" == "na" || -z "$IMAGE" ]]; then
            echo "annotation_text=deployment of ${REPOSITORY}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "annotation_text=${IMAGE}" >> "$GITHUB_OUTPUT"
          fi
      - id: notify
        name: Notify deployment
        continue-on-error: true
        uses: entur/gha-notify-deployment/.github/actions/notify-deployment@v1
        with:
          gitdailies-url: ${{ vars.GITDAILIES_WEBHOOK_URL }}
          gitdailies-key: ${{ secrets.GITDAILIES_WEBHOOK_KEY }}
          grafana-url: ${{ vars.GRAFANA_CLOUD_URL }}
          grafana-key: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          environment: ${{ steps.prepare.outputs.environment }}
          grafana-annotation-text: ${{ steps.prepare.outputs.annotation_text }}
          grafana-annotation-tags: ${{ inputs.cloud_provider }}
          deployment-start-time: ${{ needs.helm-deploy.outputs.DEPLOY_START_TIME }}
          deployment-end-time: ${{ needs.helm-deploy.outputs.DEPLOY_END_TIME }}
