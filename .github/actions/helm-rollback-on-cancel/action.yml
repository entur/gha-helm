name: Entur/Helm/Rollback-On-Cancel
description: Rolls back the Helm release if the job is canceled during deployment and a pending rollout exists
inputs:
  release_name:
    description: "The release name"
    required: true
  namespace:
    description: "The Kubernetes namespace"
    required: true
  timeout_minutes:
    description: "Job timeout in minutes (default same value as helm-deploy)."
    required: true
outputs:
  ROLLBACK_STATUS:
    description: "Outcome of the cancellation rollback: rolled_back, no_pending_rollout, query_failed, or rollback_failed."
    value: ${{ steps.rollback.outputs.ROLLBACK_STATUS }}
runs:
  using: "composite"
  steps:
    - id: rollback
      shell: bash
      env:
        TIMEOUT: ${{ inputs.timeout_minutes }}
        RELEASE_NAME: ${{ inputs.release_name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        TIMEOUT=$((TIMEOUT/2-2))
        if (( TIMEOUT < 1 )); then TIMEOUT=1; fi
        if (( TIMEOUT > 4 )); then TIMEOUT=4; fi
        if ! PENDING=$(helm list --pending -n "${NAMESPACE}" --filter "^${RELEASE_NAME}$" --short); then
          echo "#################################################################################################"
          echo " Failed to query Helm for pending rollouts of '${RELEASE_NAME}'. Please investigate manually."
          echo "#################################################################################################"
          echo "ROLLBACK_STATUS=query_failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if [[ -n "${PENDING}" ]]; then
          echo "#################################################################################################"
          echo " Job cancelled. Rolling back Helm release '${RELEASE_NAME}'..."
          echo "#################################################################################################"
          if helm rollback "${RELEASE_NAME}" --namespace "${NAMESPACE}" --wait --timeout "${TIMEOUT}m0s" --debug; then
            echo "#################################################################################################"
            echo " Helm rollback on cancellation successful."
            echo "#################################################################################################"
            echo "ROLLBACK_STATUS=rolled_back" >> "$GITHUB_OUTPUT"
          else
            echo "#################################################################################################"
            echo " Helm rollback on cancellation failed. Please investigate manually."
            echo "#################################################################################################"
            echo "ROLLBACK_STATUS=rollback_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        else
          echo "No active rollout found for '${RELEASE_NAME}' in '${NAMESPACE}'. Nothing to roll back."
          echo "ROLLBACK_STATUS=no_pending_rollout" >> "$GITHUB_OUTPUT"
        fi
